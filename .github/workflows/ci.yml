name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webapp:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    # Full PG/Chromium coverage and the separate memory evaluation stay required.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: squabble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squabble_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for isolated browser-collector fixtures
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium sandbox for isolated fixtures
        timeout-minutes: 2
        run: |
          node --test scripts/check-browser-sandbox.spec.cjs
          node scripts/check-browser-sandbox.cjs

      - name: Lint (eslint + stylelint + typecheck)
        run: npm run lint

      - name: Verify contributor skill and knowledge helpers
        run: |
          npm run test:context
          npm run check:context

      - name: Verify module dependency boundaries
        run: npm run test:architecture

      - name: Initialize isolated integration database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d squabble_test -v ON_ERROR_STOP=1 -f scripts/db/01_schema.sql
          node scripts/db/list-startup-migrations.cjs > "$RUNNER_TEMP/startup-migrations.txt"
          while IFS= read -r migration; do
            psql -h localhost -U postgres -d squabble_test -v ON_ERROR_STOP=1 -f "scripts/db/$migration"
          done < "$RUNNER_TEMP/startup-migrations.txt"

      - name: Run server tests
        env:
          AGENT_ROSTER_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          A2A_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          TEAM_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          TELEMETRY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          BUDGET_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          COUNCIL_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          AUTH_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          STRATEGY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          MEMORY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          RESEARCH_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          EXPERIENCE_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          HISTORY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          TOOL_CONNECTIONS_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          CHANNEL_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          DATA_LIBRARY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
        run: npm run test:server

      - name: Resolve compiled application providers without starting jobs
        env:
          WIRING_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
        run: npm run test:wiring

      - name: Evaluate fictional research memory operations and retrieval
        env:
          MEMORY_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          COUNCIL_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
        run: npm run --silent test:memory-eval > memory-evaluation.json

      - name: Save research memory evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-evaluation
          path: memory-evaluation.json
          if-no-files-found: ignore

      - name: Run client tests
        run: npm run test:client

      - name: Verify development startup and process cleanup
        run: npm run test:dev

      - name: Run native agent tests
        run: |
          npm run test:local-agents

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run offline test suite
        run: uv run pytest -q

      - name: Install locked analytics worker dependencies
        working-directory: workers/analytics
        run: uv sync --locked

      - name: Run fixed-template analytics and backtest tests
        working-directory: workers/analytics
        run: uv run --no-sync python -m pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build self-hosted image
        run: docker build -t squabble-ci-app:local .

      - name: Verify bundled deployment boundaries
        env:
          BUNDLE_TEST_APP_IMAGE: squabble-ci-app:local
        run: |
          node --test deploy/bundle-contract.spec.cjs deploy/release-bundle.spec.cjs deploy/configure-source-host.spec.cjs deploy/source-host-relay.spec.cjs
          python -m unittest discover -s deploy -p test_bundle_gateway.py
